data_sources:
  tushare:
    name: "Tushare"
    type: "api"
    priority: 1
    enabled: true
    module: "data.sources.tushare_source"
    class: "TushareSource"
    config:
      token_env: "TUSHARE_TOKEN"
      rate_limit: 200
    supported_tables:
      - daily_prices
      - fund_flow
      - financials
      - stocks
      - index_prices
      - daily_basic
      - income
      - balancesheet
      - cashflow
      - fina_indicator
      - adj_factor
    fallback: []
